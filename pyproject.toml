[tool.poetry]
packages = [
    { include = "pysatl_criterion", from = "src" },
]
name = "pysatl-criterion"
version = "1.0.0"
description = "Package with statistic criteria for PySATL"
authors = ["PySATL Team <pysatl@yahoo.com>"]
license = "Apache License 2.0"
readme = "README.md"

[tool.poetry.dependencies]
numpy = ">=1.25.1"
scipy = ">=1.11.2"
pandas = ">=2.2.1"
typing-extensions = ">=4.12.2"
networkx = "==3.4.2"
sqlalchemy = "==2.0.54"
zstandard = "==0.25.0"
python-dotenv = ">=1.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
python = ">=3.10,<3.13"
numba = ">=0.66,<0.69"

[tool.poetry.urls]
Homepage = "https://github.com/PySATL/pysatl-criterion"
Issues = "https://github.com/PySATL/pysatl-criterion/issues"

[build-system]
requires = ["poetry-core>=2.2,<3", "poetry-dynamic-versioning>=1.8,<2"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.8.0,<2.0.0", extras = ["plugin"] }

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
lint = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-random-order==1.2.0",
    "pytest-mock==3.16.0",
    "coveralls==4.1.0",
    # Independent reference; never a runtime dependency.
    "statsmodels==0.14.6",
]
docs = [
    "markdown==3.10.3",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mdx-truly-sane-lists==1.3",
    "pymdown-extensions==12.1",
    "jinja2==3.1.6",
    "mike==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: persistence and loader integration tests",
    "statistical: opt-in Monte Carlo validation of level and power",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".env", ".venv"]

[tool.ruff.lint]
extend-select = [
  "C90", "B", "F", "E", "W", "UP", "I", "A", "TID", "YTT", "S", "PTH", "ASYNC", "NPY"
]
extend-ignore = [
  "E241", "E272", "E221", "B007", "B904", "S603", "S607", "S608", "NPY002"
]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pysatl_criterion.hypothesis_testing.goodness_of_fit_test.goodness_of_fit_test"
check_untyped_defs = true
disallow_untyped_defs = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", "S104", "S311", "S105", "S106", "S110"
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

# Format for NOT tagged commits
format-jinja = """
{%- if distance == 0 -%}
    {{ base }}
{%- else -%}
    {{ bump_version(base, -2) }}.dev{{ distance }}
{%- endif -%}
"""
