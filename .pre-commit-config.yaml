# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Use the locked project environment so hooks and CI run identical tools.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy src/pysatl_criterion tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                tests/.*|
                .*\.svg|
                .*\.yml|
                .*\.json
            )$
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-ast
      - id: trailing-whitespace
        exclude: |
          (?x)^(
                .*\.md
            )$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
    - id: codespell
      args: [ "--ignore-words=.codespell-ignore-words" ]
      additional_dependencies:
        - tomli
