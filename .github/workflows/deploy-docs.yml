name: Build Documentation

on:
  push:
    branches:
      - main
  release:
    types: [published]


# disable permissions for all of the available permissions
permissions: {}


jobs:
  build-docs:
    permissions:
      contents: write  #  for mike to push
    name: Deploy Docs through mike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install documentation dependencies
        run: |
          poetry check --lock
          poetry sync --only docs --no-root

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Build and push Mike
        if: ${{ github.event_name == 'push' }}
        run: |
          poetry run mike deploy ${{ github.ref_name }} latest --push --update-aliases

      - name: Build and push Mike - Release
        if: ${{ github.event_name == 'release' }}
        run: |
          poetry run mike deploy ${{ github.ref_name }} stable --push --update-aliases

      - name: Show mike versions
        run: |
          poetry run mike list
